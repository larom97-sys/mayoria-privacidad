<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel · Gestión de consulta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="nav">
  <div class="wrap">
    <span class="brand"><span id="clinic-name">Panel</span> <span class="muted">· Fisioterapia</span></span>
    <nav id="nav" hidden>
      <button class="tab" type="button" data-view="seguimiento">Seguimiento</button>
      <button class="tab" type="button" data-view="pacientes">Pacientes</button>
      <button class="tab" type="button" data-view="productos">Biblioteca</button>
      <button class="tab" type="button" data-view="ajustes">Ajustes</button>
      <button class="tab" type="button" id="logout">Salir</button>
    </nav>
  </div>
  <div id="banner" hidden></div>
</header>

<main class="wrap">
  <section id="auth"></section>
  <section id="onboard" hidden></section>

  <section id="v-seguimiento" hidden>
    <div class="pagehead"><h1>Seguimiento</h1></div>
    <div class="stats" id="track-stats"></div>
    <div id="tracking"></div>
  </section>

  <section id="v-pacientes" hidden>
    <div class="pagehead">
      <h1>Pacientes</h1>
      <button class="pill" type="button" id="new-patient">Nuevo paciente</button>
    </div>
    <div class="split">
      <div class="panel" id="patient-list"></div>
      <div class="panel" id="patient-card"></div>
    </div>
  </section>

  <section id="v-productos" hidden>
    <div class="pagehead">
      <div><h1>Biblioteca clínica</h1><p class="muted">Plantillas internas de la clínica. Los pacientes solo ven lo que se les asigna.</p></div>
      <button class="pill" type="button" id="new-product">Nuevo programa</button>
    </div>
    <div class="filters" id="lib-filters"></div>
    <p class="muted small" id="lib-count" style="margin-bottom:14px"></p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="v-ajustes" hidden>
    <div class="pagehead"><h1>Ajustes y facturación</h1></div>
    <div class="stack" id="billing"></div>
  </section>
</main>

<dialog id="rx" aria-label="Prescripción y evolución"><div class="dlg" id="rx-body"></div></dialog>
<dialog id="editor" aria-label="Editor de programa"><div class="dlg" id="editor-body"></div></dialog>
<dialog id="upgrade" aria-label="Mejorar plan"><div class="dlg" id="upgrade-body"></div></dialog>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="clinical.js"></script>
<script src="pdf.js"></script>
<script src="admin.js"></script>
<script src="tracking.js"></script>
<script src="billing.js"></script>
</body>
</html>
