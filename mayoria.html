<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mayoría</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#120A05">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mayoría: campaña política por turnos. Pocas acciones por semana, diez regiones, un objetivo: 51 escaños.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<style>
/* Disposición: aplicación de una pantalla. Barra de estado arriba, mapa hexagonal al centro,
   panel de decisiones abajo y navegación inferior. Oscuro cálido, cristal y brillos dorados. */
:root{
  color-scheme:dark;
  --fondo:#120A05; --fondo2:#1C1108; --cristal:rgba(255,232,190,.065); --cristal2:rgba(255,232,190,.11);
  --borde:rgba(232,182,74,.24); --borde2:rgba(232,182,74,.5);
  --txt:#F2E6CC; --mut:#B9A98A; --oro:#E8B64A; --oro2:#F8E3A6; --tinta:#1A0F06;
  --ok:#7BD67F; --mal:#FF7A66; --indeciso:#6B5B45;
  --yo:#E8B64A; --r1:#3FC1C9; --r2:#9B7BFF; --r3:#E86FA6;
  --titulo:Georgia,"Times New Roman",serif;
  --cuerpo:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --lado-i:max(16px, env(safe-area-inset-left, 0px)); --lado-d:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--fondo);color:var(--txt);font:15px/1.4 var(--cuerpo);overflow:hidden;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 40% at 20% 0%,rgba(232,182,74,.16),transparent 70%),
             radial-gradient(50% 35% at 100% 100%,rgba(155,123,255,.10),transparent 70%),
             radial-gradient(40% 30% at 0% 90%,rgba(63,193,201,.08),transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--oro2);outline-offset:2px}
input{font:inherit;color:var(--txt)}
a{color:var(--oro)}
h1,h2,h3{font-family:var(--titulo);font-weight:400;margin:0;text-wrap:balance}
#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;min-height:0}
.pant{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto;
  padding-block:14px;padding-left:var(--lado-i);padding-right:var(--lado-d);-webkit-overflow-scrolling:touch}
.cab{display:flex;align-items:center;gap:10px}
.cab h2{font-size:1.35rem;color:var(--oro2);flex:1;min-width:0}
.atras{width:40px;height:40px;border-radius:12px;background:var(--cristal);border:1px solid var(--borde);font-size:1.2rem;flex:none}
.cristal{background:var(--cristal);border:1px solid var(--borde);border-radius:16px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.caja{padding:12px 14px}
.mut{color:var(--mut)} .peq{font-size:.82rem} .oro{color:var(--oro)} .ok{color:var(--ok)} .mal{color:var(--mal)}
.num{font-variant-numeric:tabular-nums}
.fila{display:flex;align-items:center;gap:8px} .fila>.cre{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:8px}
.rej{display:grid;gap:8px} .rej2{grid-template-columns:1fr 1fr} .rej3{grid-template-columns:repeat(3,1fr)}
.etq{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:14px;
  background:var(--cristal2);border:1px solid var(--borde);font-weight:600;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#F3CC6B,#D9A235);color:var(--tinta);border-color:#F8E3A6;
  box-shadow:0 0 22px rgba(232,182,74,.35)}
.btn[disabled],.btn.no{opacity:.45}
.btn.bloq{opacity:.55;border-style:dashed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--cristal2);
  border:1px solid var(--borde);font-size:.76rem;white-space:nowrap}
.chip.ok{border-color:rgba(123,214,127,.5)} .chip.mal{border-color:rgba(255,122,102,.5)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.barra{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.barra>i{display:block;height:100%;background:linear-gradient(90deg,var(--oro),var(--oro2));border-radius:99px;transition:width .5s}
.seg{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--indeciso)}
.seg>i{display:block;height:100%;transition:width .5s}

/* Inicio */
.logo{font-family:var(--titulo);font-size:3.1rem;letter-spacing:.06em;color:var(--oro2);text-align:center;line-height:1;
  text-shadow:0 0 28px rgba(232,182,74,.55),0 0 2px rgba(232,182,74,.9);margin-top:10px}
.lema{text-align:center;color:var(--mut)}
.hemi{display:block;margin:0 auto;width:min(240px,70%)}

/* Tarjetas de selección */
.opc{display:flex;gap:12px;align-items:center;padding:12px 14px;text-align:left;border-radius:16px;
  background:var(--cristal);border:1px solid var(--borde);width:100%}
.opc.sel{border-color:var(--oro2);box-shadow:0 0 0 1px var(--oro2),0 0 20px rgba(232,182,74,.28);background:var(--cristal2)}
.opc.bloq{opacity:.5}
.opc .ico{font-size:1.7rem;width:44px;text-align:center;flex:none}
.opc b{display:block}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;flex:none;
  background:var(--cristal2);border:1px solid var(--borde2)}
.muestra{width:40px;height:40px;border-radius:50%;border:2px solid transparent;flex:none}
.muestra.sel{border-color:#fff;box-shadow:0 0 14px currentColor}
.emb{width:44px;height:44px;border-radius:12px;background:var(--cristal);border:1px solid var(--borde);font-size:1.3rem;flex:none}
.emb.sel{border-color:var(--oro2);background:var(--cristal2)}
.campo{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--borde);background:rgba(0,0,0,.3);padding:8px 12px;
  -webkit-user-select:text;user-select:text}
.tema{padding:8px 10px;border-radius:12px;background:var(--cristal);border:1px solid var(--borde);font-size:.88rem;text-align:left}
.tema.sel{border-color:var(--oro2);background:var(--cristal2)}

/* Juego */
.hud{padding-top:10px;padding-left:var(--lado-i);padding-right:var(--lado-d);display:flex;flex-direction:column;gap:6px;flex:none}
.hud .f1{display:flex;gap:6px;align-items:stretch}
.dato{flex:1;min-width:0;padding:5px 6px;border-radius:12px;background:var(--cristal);border:1px solid var(--borde);text-align:center}
.dato b{display:block;font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.dato span{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.pips{letter-spacing:2px;color:var(--oro)}
.proy{display:flex;justify-content:space-between;font-size:.78rem;gap:8px}
.cuerpo{flex:1;min-height:0;display:flex;flex-direction:column}
.mapa-wrap{flex:1;min-height:150px;position:relative;padding-left:var(--lado-i);padding-right:var(--lado-d)}
.mapa-wrap svg{width:100%;height:100%;display:block}
.hex polygon{stroke:rgba(248,227,166,.35);stroke-width:1.2;transition:fill .4s,fill-opacity .4s}
.hex.sel polygon{stroke:#fff;stroke-width:2.6;filter:drop-shadow(0 0 6px rgba(248,227,166,.9))}
.hex text{fill:var(--txt);text-anchor:middle;pointer-events:none;font-family:var(--cuerpo)}
.hex .n{font-size:10px;fill:var(--oro2)}
.hex .p{font-size:17px;font-weight:700}
.hex .e{font-size:8.5px;fill:var(--mut)}
.flota{font-size:15px;font-weight:800;text-anchor:middle;pointer-events:none;animation:flota 1.3s ease-out forwards;
  paint-order:stroke;stroke:#120A05;stroke-width:3px}
@keyframes flota{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
.panel{flex:none;padding:6px var(--lado-d) 8px var(--lado-i);display:flex;flex-direction:column;gap:6px}
.reg-cab{display:flex;align-items:baseline;gap:8px}
.reg-cab h3{font-size:1.1rem;color:var(--oro2);flex:1;min-width:0}
.acc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;padding:5px 3px;
  border-radius:12px;background:var(--cristal);border:1px solid var(--borde);text-align:center;line-height:1.15}
.acc:active{transform:scale(.96)}
.acc b{font-size:.8rem}
.acc .ef{font-size:.7rem;color:var(--ok)}
.acc .co{font-size:.66rem;color:var(--mut)}
.acc.no{opacity:.4}
.fin{min-height:54px;padding:6px 8px}
.guia{padding:8px 12px;border-radius:12px;background:rgba(232,182,74,.16);border:1px solid var(--borde2);font-size:.88rem}
.nav{flex:none;display:flex;border-top:1px solid var(--borde);background:rgba(18,10,5,.92);
  padding:0 var(--lado-d) env(safe-area-inset-bottom,0px) var(--lado-i)}
.nav button{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:.64rem;color:var(--mut)}
.nav button i{font-style:normal;font-size:1.15rem;filter:grayscale(.6);opacity:.7}
.nav button.sel{color:var(--oro2)} .nav button.sel i{filter:none;opacity:1}
.desliza{flex:1;min-height:0;overflow-y:auto;padding:10px var(--lado-d) 14px var(--lado-i);display:flex;flex-direction:column;gap:10px}
.nodo{display:block;width:100%;padding:8px;border-radius:12px;background:var(--cristal);border:1px solid var(--borde);text-align:left;font-size:.78rem;line-height:1.25}
.nodo b{display:block;font-size:.82rem}
.nodo.tengo{border-color:var(--ok);background:rgba(123,214,127,.12)}
.nodo.puedo{border-color:var(--oro2);box-shadow:0 0 14px rgba(232,182,74,.3)}
.nodo.lejos{opacity:.45}
.noti{padding:8px 10px;border-left:3px solid var(--borde2);background:var(--cristal);border-radius:0 10px 10px 0;font-size:.88rem}
.noti.b{border-left-color:var(--ok)} .noti.m{border-left-color:var(--mal)}
table{width:100%;border-collapse:collapse;font-size:.84rem}
td,th{padding:6px 4px;text-align:right;border-bottom:1px solid rgba(232,182,74,.12);font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left} th{font-weight:400;color:var(--mut);font-size:.72rem}
.punto{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px}
.graf{width:100%;height:150px;display:block}

/* Modales y avisos */
#velo{position:fixed;inset:0;z-index:20;background:rgba(8,4,2,.72);display:flex;align-items:flex-end;justify-content:center;
  padding:16px var(--lado-d) calc(16px + env(safe-area-inset-bottom,0px)) var(--lado-i);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal{width:100%;max-width:480px;max-height:100%;overflow-y:auto;padding:16px;border-radius:20px;background:#22150A;
  border:1px solid var(--borde2);box-shadow:0 0 40px rgba(232,182,74,.22);display:flex;flex-direction:column;gap:10px;
  animation:sube .22s ease-out}
.modal h3{font-size:1.25rem;color:var(--oro2)}
@keyframes sube{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.dec{display:flex;flex-direction:column;gap:5px;align-items:flex-start;width:100%;padding:11px 12px;border-radius:14px;
  background:var(--cristal2);border:1px solid var(--borde);text-align:left}
.dec:active{transform:scale(.98)} .dec.no{opacity:.45}
#aviso{position:fixed;left:50%;top:calc(118px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;
  max-width:min(88vw,420px);padding:9px 14px;border-radius:12px;background:#2B1B0D;border:1px solid var(--borde2);
  font-size:.88rem;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.5);pointer-events:none;transition:opacity .25s}
.estrellas{font-size:2.2rem;letter-spacing:6px;text-align:center}
.revela{animation:sube .3s ease-out}
.esc-barra{position:relative}
.esc-barra .linea{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;left:50.5%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sinanim *{animation:none!important;transition:none!important}
@media (max-height:640px){.acc{min-height:48px}.fin{min-height:48px}.dato span{display:none}.acc .co{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="velo" hidden></div>
<div id="aviso" hidden></div>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════════════════
   MAYORÍA · Campaña por turnos
   ────────────────────────────────────────────────────────────────────────────────
   TABLA DE EQUILIBRIO
   Todo lo que afecta al ritmo y a la dificultad está aquí. La lógica de más abajo
   solo lee estos valores: se pueden ajustar sin tocar nada más.
   ════════════════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  VERSION: '2.0.0',
  CLAVE_GUARDADO: 'mayoria_v2',          // prefijo de localStorage
  MOSTRAR_MODOS_FUTUROS: false,          // true = enseña «Crisis» y «Cartas» como «en preparación»

  CAMPANA: {
    semanas: { expres: 8, completa: 12 },// duración de cada modo, en turnos
    paPorSemana: { expres: 4, completa: 3 }, // puntos de acción (PA) por turno en cada modo
    escanos: 101, mayoria: 51,           // tamaño del parlamento y objetivo
    umbralEscano: 3,                     // % mínimo en una región para optar a escaños
    fondosIni: 60, ingresoSemanal: 15,
    credIni: 60,                         // credibilidad inicial (0-100)
    influenciaPorSemana: 1,              // puntos para el Árbol
    apoyoIniJugador: [8, 12],            // % inicial del jugador en cada región (mín, máx)
    indecisosIni: [30, 40],              // % inicial de indecisos en cada región
    cuotaIndecisos: 0.6,                 // parte de cada ganancia que sale de indecisos (el resto, de rivales)
    saturacion: 0.7,                     // multiplicador al repetir la misma acción en la misma región y semana
    bonusTemaSemana: 0.25,               // extra en regiones a las que les importa el tema de la semana
    bonusTemaBandera: 0.25,              // extra del Mitin donde importa uno de tus temas bandera
    frenoDesde: 30, frenoMin: 0.45,      // rendimientos decrecientes: a partir de este % cuesta más crecer
    maxPromesas: 3, maxOrg: 5,
    probEvento: 1.0                      // probabilidad de decisión al empezar la semana (desde la 2.ª)
  },

  ACCIONES: {
    mitin:      { pa: 1, fondos: 15, apoyo: 5.0 },
    puerta:     { pa: 1, fondos: 0,  apoyo: 2.5, org: 1 },
    anuncios:   { pa: 1, fondos: 30, apoyo: 3.5, vecinas: 1.6 },
    recaudar:   { pa: 1, fondos: 0,  base: 18, porApoyo: 0.9, desgaste: 1.0 },
    sede:       { pa: 2, fondos: 45, org: 2, ingreso: 4, defensa: 0.35 },
    contraste:  { pa: 1, fondos: 20, dano: 5.0, robo: 0.5, riesgo: 0.30, penaCred: 6, penaRel: 12, penaRelFallo: 10 },
    entrevista: { pa: 2, fondos: 0,  probBase: 0.40, probPorCred: 0.004, exito: 2.2, credExito: 5, fallo: -1.0, credFallo: -7 },
    promesa:    { pa: 1, fondos: 0,  apoyo: 4.5, costeCumplir: 25, penaCred: 12, penaApoyo: 3, probPrueba: 0.30 },
    puentes:    { pa: 1, fondos: 0,  rel: 18 }
  },

  ORG:  { apoyoSemanal: 0.35, defensaPorNivel: 0.08, defensaMax: 0.8, bonusElectoral: 0.05 },
  CRED: { multMin: 0.75, multMax: 1.25 },   // la credibilidad multiplica todo lo que convences
  PACTO:{ relIni: 45, umbral: 55 },         // relación mínima para que un rival acepte pactar
  ELECCION: { ruido: 2.0 },                 // desviación máxima (en puntos) entre sondeo y voto real

  DIFICULTAD: {
    facil:      { nombre: 'Fácil',      nivel: 1, accRival: 1, fuerza: 1.15, ataque: 0.10, fondosExtra: 30, xp: 0.8, desc: 'Rivales tranquilos y algo más de dinero.' },
    normal:     { nombre: 'Normal',     nivel: 1, accRival: 2, fuerza: 0.80, ataque: 0.15, fondosExtra: 0,  xp: 1.0, desc: 'La experiencia pensada para una campaña ajustada.' },
    dificil:    { nombre: 'Difícil',    nivel: 3, accRival: 2, fuerza: 1.05, ataque: 0.22, fondosExtra: -10, xp: 1.4, desc: 'Rivales que reaccionan cuando subes.' },
    implacable: { nombre: 'Implacable', nivel: 5, accRival: 3, fuerza: 1.00, ataque: 0.28, fondosExtra: -20, xp: 1.9, desc: 'Tres partidos contra ti. Solo para veteranos.' }
  },

  EQUIPO_MAX: 2,                            // asesores contratados a la vez

  META: {
    niveles: [0, 120, 320, 600, 950, 1400, 1950, 2600, 3400, 4400], // XP acumulada para cada nivel
    xpPorEscano: 2, xpPorEstrella: 40, xpLogro: 40, xpDiario: 15,
    bonoDiarioFondos: 8, bonoDiarioTope: 5,   // fondos extra por día de racha (hasta el tope)
    xpRetoPorRacha: 25,                       // XP extra por cada semana de racha en el reto semanal
    nivelReto: 2,
    huecosLegado: [{ nivel: 3, huecos: 1 }, { nivel: 6, huecos: 2 }]
  }
};

/* ══════════════ CONTENIDO (todo ficticio) ══════════════ */
const PAIS = 'Auria';
const TEMAS = {
  empleo:    { n: 'Empleo',    i: '🛠️' }, sanidad:  { n: 'Sanidad',   i: '🩺' },
  vivienda:  { n: 'Vivienda',  i: '🏠' }, seguridad:{ n: 'Seguridad', i: '🛡️' },
  entorno:   { n: 'Entorno',   i: '🌳' }, educacion:{ n: 'Educación', i: '📚' }
};
const TEMA_IDS = Object.keys(TEMAS);
// pos: centro del hexágono en el mapa; fuerte: partido rival con ventaja histórica (1-3)
const REGIONES = [
  { n: 'Altos de Niebla', c: ['Altos de', 'Niebla'],  esc: 8,  temas: ['entorno', 'sanidad'],    pos: [93.3, 55],   fuerte: 2 },
  { n: 'Bosque Umbrío',   c: ['Bosque', 'Umbrío'],    esc: 7,  temas: ['entorno', 'empleo'],     pos: [179.9, 55],  fuerte: 2 },
  { n: 'Costa Alba',      c: ['Costa', 'Alba'],       esc: 14, temas: ['vivienda', 'empleo'],    pos: [50, 130],    fuerte: 1 },
  { n: 'Sierra Brava',    c: ['Sierra', 'Brava'],     esc: 6,  temas: ['seguridad', 'sanidad'],  pos: [136.6, 130], fuerte: 3 },
  { n: 'Valle Hondo',     c: ['Valle', 'Hondo'],      esc: 9,  temas: ['empleo', 'educacion'],   pos: [223.2, 130], fuerte: 3 },
  { n: 'Puerto Lumen',    c: ['Puerto', 'Lumen'],     esc: 16, temas: ['vivienda', 'educacion'], pos: [93.3, 205],  fuerte: 1 },
  { n: 'Llano Dorado',    c: ['Llano', 'Dorado'],     esc: 11, temas: ['empleo', 'seguridad'],   pos: [179.9, 205], fuerte: 2 },
  { n: 'Campo Viejo',     c: ['Campo', 'Viejo'],      esc: 13, temas: ['sanidad', 'seguridad'],  pos: [136.6, 280], fuerte: 3 },
  { n: 'Ribera Clara',    c: ['Ribera', 'Clara'],     esc: 12, temas: ['educacion', 'sanidad'],  pos: [223.2, 280], fuerte: 1 },
  { n: 'Islas Serenas',   c: ['Islas', 'Serenas'],    esc: 5,  temas: ['entorno', 'vivienda'],   pos: [40, 296],    fuerte: 0, isla: true }
];
const HEX_R = 49;
const VECINAS = REGIONES.map((a, i) => REGIONES.map((b, j) => j).filter(j => j !== i &&
  !a.isla && !REGIONES[j].isla && Math.hypot(a.pos[0] - REGIONES[j].pos[0], a.pos[1] - REGIONES[j].pos[1]) < 95));
VECINAS[9] = [5, 7]; VECINAS[5].push(9); VECINAS[7].push(9);

const RIVALES = [null,

let _audio = null;
function sonido(tipo) {
  if (!P.ajustes.sonido) return;
  try {
    _audio = _audio || new (window.AudioContext || window.webkitAudioContext)();
    const notas = { toque: [520], bien: [520, 780], mal: [300, 200], fin: [392, 523, 659, 784], compra: [660, 880] }[tipo] || [440];
    notas.forEach((f, k) => {
      const o = _audio.createOscillator(), g = _audio.createGain(), t = _audio.currentTime + k * 0.09;
      o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.08, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(_audio.destination); o.start(t); o.stop(t + 0.18);
    });
  } catch (e) {}
}

function nivelDe(xp) { const n = CONFIG.META.niveles; let l = 1; for (let k = 0; k < n.length; k++) if (xp >= n[k]) l = k + 1; return l; }
function progresoNivel() {
  const n = CONFIG.META.niveles, l = nivelDe(P.xp);
  if (l >= n.length) return { nivel: l, pct: 100, falta: 0 };
  return { nivel: l, pct: (P.xp - n[l - 1]) / (n[l] - n[l - 1]) * 100, falta: n[l] - P.xp };
}
function huecosLegado() { const l = nivelDe(P.xp); let h = 0; CONFIG.META.huecosLegado.forEach(x => { if (l >= x.nivel) h = x.huecos; }); return h; }
function desbloqueosDe(nivel) {
  const out = [];
  LIDERES.forEach(x => { if (x.nivel === nivel) out.push('Líder: ' + x.n + ', ' + x.mote); });
  Object.values(CONFIG.DIFICULTAD).forEach(x => { if (x.nivel === nivel) out.push('Dificultad: ' + x.nombre); });
  Object.values(MODOS).forEach(x => { if (x.activo && x.nivel === nivel) out.push('Modo: ' + x.n); });
  LEGADOS.forEach(x => { if (x.nivel === nivel) out.push('Legado: ' + x.n); });
  CONFIG.META.huecosLegado.forEach(x => { if (x.nivel === nivel) out.push(x.huecos === 1 ? 'Primer hueco de legado' : 'Segundo hueco de legado'); });
  return out;
}
function ganarXP(n) {
  const antes = nivelDe(P.xp); P.xp += Math.round(n); const despues = nivelDe(P.xp); const nuevos = [];
  for (let l = antes + 1; l <= despues; l++) nuevos.push(...desbloqueosDe(l));
  return { antes, despues, nuevos };
}
const hoyStr = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function semanaId(d = new Date()) { // semanas completas desde un lunes fijo; cambia cada lunes
  const local = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); return Math.floor((local / 86400000 + 3) / 7);
}
function retoActual() { const s = semanaId(); return Object.assign({ sem: s, num: s - 2900, seed: s * 7919 + 13 }, RETOS[s % RETOS.length]); }
function diasParaLunes() { const d = new Date().getDay(); return d === 0 ? 1 : 8 - d; }
function comprobarDia() { // racha diaria; devuelve aviso si hoy es un día nuevo
  const hoy = hoyStr(); if (P.ultimoDia === hoy) return null;
  const ayer = new Date(); ayer.setDate(ayer.getDate() - 1);
  P.racha = P.ultimoDia === hoyStr(ayer) ? P.racha + 1 : 1; P.ultimoDia = hoy;
  P.bono = CONFIG.META.bonoDiarioFondos * Math.min(P.racha, CONFIG.META.bonoDiarioTope);

    '<div class="cristal caja col"><div class="fila"><b class="cre">Colección de estrellas</b><span class="num">' + tengo + ' de ' + total + '</span></div><div class="barra"><i style="width:' + tengo / total * 100 + '%"></i></div><div class="peq mut">Hasta 3 estrellas por cada líder en cada dificultad.</div></div>' +
    (prox ? '<div class="etq">Próximos desbloqueos</div>' + prox : '') +
    '<div class="etq">Logros (' + LOGROS.filter(l => P.logros[l.id]).length + ' de ' + LOGROS.length + ')</div>' +
    LOGROS.map(l => '<div class="noti ' + (P.logros[l.id] ? 'b' : '') + '" style="' + (P.logros[l.id] ? '' : 'opacity:.6') + '"><b>' + (P.logros[l.id] ? '🏅 ' : '') + l.n + '</b> · ' + l.d + '</div>').join('') + '</div>';
}
function vAjustes() {
  const a = P.ajustes, fila = (k, n) => '<button class="opc" data-act="ajuste" data-k="' + k + '"><span class="cre"><b>' + n + '</b></span><span class="chip ' + (a[k] ? 'ok' : '') + '">' + (a[k] ? 'Sí' : 'No') + '</span></button>';
  return '<div class="pant">' + cab('Ajustes', 'inicio') + fila('sonido', 'Sonido') + fila('vibra', 'Vibración') + fila('anim', 'Animaciones') +
    '<button class="btn" data-act="como">Cómo se juega</button><button class="btn" data-act="borrar">Borrar todo mi progreso</button>' +
    '<div class="cristal caja peq mut">Tu progreso se guarda solo en este dispositivo. <a href="index.html" target="_blank" rel="noopener">Política de privacidad</a><br>Mayoría ' + CONFIG.VERSION + ' · Obra de ficción: partidos, personas y lugares son inventados.</div></div>';
}
function comoSeJuega(alCerrar) {
  if (alCerrar) U.cola.push(alCerrar);
  modal('<h3>Cómo se gana</h3>' +
    '<div class="noti"><b>Objetivo.</b> Llegar a ' + C.mayoria + ' de ' + C.escanos + ' escaños el día de las elecciones, o sumar mayoría con un pacto.</div>' +
    '<div class="noti"><b>Cada semana</b> tienes ' + (G ? paBase() : C.paPorSemana.completa) + ' acciones. Toca una región y decide: mitin, puerta a puerta, anuncios, recaudar, abrir sede o contraste.</div>' +
    '<div class="noti"><b>Antes de pulsar</b> ves lo que vas a ganar y lo que cuesta. Las regiones con más escaños pesan más.</div>' +
    '<div class="noti"><b>La credibilidad</b> multiplica todo lo que convences. Las promesas rotas y el juego sucio la hunden.</div>' +
    '<div class="noti"><b>Los rivales también juegan.</b> Si te llevas bien con alguno, podrás pactar al final.</div>' +
    '<button class="btn pri" data-act="cerrar">Entendido</button>');
}
const INFO = {
  sem: () => 'Quedan ' + Math.max(0, G.semanas - G.semana) + ' semanas después de esta. Luego se vota.',
  pa: () => 'Puntos de acción: lo que puedes hacer esta semana. Se renuevan al terminarla.',
  fondos: () => 'Fondos para mítines, anuncios y sedes. Cada semana entran ' + ingreso() + '. El detalle está en Gestión.',
  cred: () => 'Credibilidad: ahora mismo tus acciones convencen un ' + Math.round(credMult() * 100) + ' % de lo normal.',
  inf: () => 'Influencia: se gasta en el Árbol. Ganas 1 cada semana.'
};

/* ── Acciones del jugador ── */
function tras(res) { // después de una acción: sonido, redibujo y números flotantes
  if (!res.ok) { aviso(res.motivo); sonido('mal'); return; }
  sonido(res.bueno ? 'bien' : 'mal'); Plataforma.vibrar(res.bueno ? 15 : 60); if (G.guia === 1) G.guia = 2;
  pintar(); if (res.flota && res.flota.length) flotar(res.flota); aviso(res.msg);
}
function prepararNueva(modo, difi) {
  const u = P.ultimo || {}, l = nivelDe(P.xp), lid = LIDERES.find(x => x.id === u.lider && l >= x.nivel) ? u.lider : 'oradora';
  U.prep = { modo, dif: difi, lider: lid, nombre: u.nombre || 'Alianza Horizonte', color: u.color || COLORES[0], emblema: u.emblema || EMBLEMAS[0],
    banderas: (u.banderas || ['empleo', 'vivienda']).slice(0, 2), legados: (u.legados || []).filter(id => l >= LEGADOS.find(x => x.id === id).nivel).slice(0, huecosLegado()) };
}
const ACT = {
  ir: d => ir(d.p),
  cerrar: () => cerrarModal(),
  continuar: () => { G = Almacen.leer('partida'); if (!G) return ir('inicio'); U.sel = null; U.tab = 'mapa';
    if (G.fase === 'eleccion') { U.revelados = REGIONES.length; ir('eleccion'); } else if (G.fase === 'fin') ir('resultado'); else { ir('juego'); if (G.fase === 'evento') mostrarEvento(); } },
  nueva: () => ir('modos'),
  reto: () => { if (nivelDe(P.xp) < MODOS.reto.nivel) return aviso('El reto semanal se desbloquea en el nivel ' + MODOS.reto.nivel + '. Termina una campaña para subir.'); prepararNueva('reto', 'normal'); ir('partido'); },
  modo: d => { const m = MODOS[d.id]; if (!m.activo) return aviso('Este modo está en preparación.'); if (nivelDe(P.xp) < m.nivel) return aviso('Se desbloquea en el nivel ' + m.nivel + '.');
    if (d.id === 'reto') return ACT.reto(); U.modoElegido = d.id; ir('dificultad'); },
  dif: d => { if (nivelDe(P.xp) < CONFIG.DIFICULTAD[d.id].nivel) return aviso('Se desbloquea en el nivel ' + CONFIG.DIFICULTAD[d.id].nivel + '.'); prepararNueva(U.modoElegido, d.id); ir('partido'); },
  lider: d => { const x = LIDERES.find(y => y.id === d.id); if (nivelDe(P.xp) < x.nivel) return aviso(x.n + ' se desbloquea en el nivel ' + x.nivel + '.'); U.prep.lider = d.id; pintar(); },
  color: d => { U.prep.color = d.id; pintar(); }, emblema: d => { U.prep.emblema = d.id; pintar(); },
  bandera: d => { const b = U.prep.banderas, k = b.indexOf(d.id); if (k >= 0) b.splice(k, 1); else { if (b.length >= 2) b.shift(); b.push(d.id); } pintar(); },
  legado: d => { const x = LEGADOS.find(y => y.id === d.id), L = U.prep.legados, k = L.indexOf(d.id); if (nivelDe(P.xp) < x.nivel) return aviso('Se desbloquea en el nivel ' + x.nivel + '.');
    if (k >= 0) L.splice(k, 1); else { if (L.length >= huecosLegado()) L.shift(); L.push(d.id); } pintar(); },
  empezar: () => { const S = U.prep; S.nombre = (S.nombre || '').trim() || 'Alianza Horizonte';
    if (S.banderas.length < 2) return aviso('Elige dos temas bandera.');
    P.ultimo = { lider: S.lider, nombre: S.nombre, color: S.color, emblema: S.emblema, banderas: S.banderas, legados: S.legados };
    nuevaPartida(Object.assign({}, S, { bono: P.bono, seed: S.modo === 'reto' ? retoActual().seed : null })); P.bono = 0; guardarPerfil();
    U.sel = null; U.tab = 'mapa'; ir('juego'); sonido('fin'); if (!P.tutorial) { P.tutorial = true; guardarPerfil(); comoSeJuega(); } },
  tab: d => { U.tab = d.t; pintar(); },
  reg: d => { if (U.pant !== 'juego') return; const i = +d.i; U.sel = U.sel === i ? null : i; if (G.guia === 0) G.guia = 1; sonido('toque'); pintar(); },
  'reg-ir': d => { U.sel = +d.i; U.tab = 'mapa'; pintar(); },
  accion: d => { const a = d.a;
    if (a === 'promesa') { const ch = puede('promesa'); if (!ch.ok) return tras(ch); const e = efecto('promesa'), usados = G.promesas.map(p => p.tema);
      return modal('<h3>¿Qué prometes?</h3><div class="peq mut">Ganas ' + sig(e.apoyo) + ' de apoyo en las regiones a las que les importa. Más adelante te pedirán cuentas: explicarlo costará ' + A.promesa.costeCumplir + ' fondos; no hacerlo, ' + A.promesa.penaCred + ' de credibilidad.</div><div class="rej rej2">' +
        TEMA_IDS.filter(t => !usados.includes(t)).map(t => '<button class="tema" data-act="prometer" data-t="' + t + '">' + TEMAS[t].i + ' ' + TEMAS[t].n + '<br><span class="peq mut">' + REGIONES.filter(R => R.temas.includes(t)).map(R => R.c.join(' ')).join(', ') + '</span></button>').join('') + '</div><button class="btn" data-act="cerrar">Cancelar</button>'); }
    tras(ejecutar(a, a === 'entrevista' ? null : U.sel)); },
  prometer: d => { cerrarModal(); tras(ejecutar('promesa', null, d.t)); },
  puentes: d => tras(ejecutar('puentes', null, +d.p)),
  nodo: d => { const r = comprarNodo(d.id); if (!r.ok) return r.motivo && aviso(r.motivo); sonido('compra'); Plataforma.vibrar(20); pintar(); aviso('Mejora activada: ' + r.n.n + '.'); },
  contratar: d => { const r = contratar(d.id); if (!r.ok) return aviso(r.motivo); sonido('compra'); pintar(); aviso(r.e.n + ' se une a tu equipo.'); },
  'fin-semana': () => { if (G.fase !== 'acciones') return;
    if (G.pa > 0 && !U.confirmaFin) { U.confirmaFin = true; setTimeout(() => U.confirmaFin = false, 2500); return aviso('Te quedan ' + G.pa + ' PA sin usar. Pulsa otra vez para terminar igualmente.'); }
    U.confirmaFin = false; const res = terminarSemana(); U.resumen = res; sonido('toque'); U.tab = 'mapa'; pintar(); mostrarResumen(res); },
  'cerrar-resumen': () => { const res = U.resumen; cerrarModal(); if (res && res.fin) return arrancarRecuento(); if (G.fase === 'evento') mostrarEvento(); },
  decidir: d => { const r = resolverEvento(+d.k); if (!r) return aviso('No te alcanza para esa opción.');
    sonido(r.suerte === false ? 'mal' : 'bien'); Plataforma.vibrar(r.suerte === false ? 60 : 15); pintar();
    modal('<div class="etq">' + esc(r.titulo) + '</div><h3>' + (r.suerte === null ? esc(r.opcion) : r.suerte ? 'Sale bien' : 'Sale mal') + '</h3>' + (r.chips.length ? chipsHTML(r.chips) : '<div class="mut">No cambia nada.</div>') + '<button class="btn pri" data-act="cerrar">Seguir</button>'); },
  info: d => aviso(INFO[d.k]()),
  menu: () => modal('<h3>Menú</h3><button class="btn" data-act="como">Cómo se juega</button><button class="btn" data-act="salir">Guardar y salir al inicio</button><button class="btn" data-act="abandonar">Abandonar esta campaña</button><button class="btn pri" data-act="cerrar">Seguir jugando</button>'),
  como: () => comoSeJuega(),
  salir: () => { cerrarModal(); ir('inicio'); },
  abandonar: () => modal('<h3>¿Abandonar la campaña?</h3><div>Se perderá esta partida. Tu nivel y tus logros se conservan.</div><button class="btn" data-act="abandonar-si">Sí, abandonar</button><button class="btn pri" data-act="cerrar">No, seguir jugando</button>'),
  'abandonar-si': () => { Almacen.borrar('partida'); G = null; cerrarModal(); ir('inicio'); },
  'saltar-recuento': () => { clearInterval(U.temporizador); U.revelados = REGIONES.length; pintar(); },
  'tras-recuento': () => { if (G.resultado.tot[0] >= C.mayoria) { cerrarCampana(null); sonido('fin'); ir('resultado'); } else mostrarPactos(); },
  pactar: d => { const k = +d.k, op = k >= 0 ? opcionesPacto().opciones[k] : null; cerrarModal(); const F = cerrarCampana(op); sonido(F.estrellas >= 2 ? 'fin' : 'toque'); ir('resultado'); },
  compartir: async () => { const txt = textoCompartir(), r = await Plataforma.compartir(txt);
    if (r === 'copiado') aviso('Resultado copiado. Pégalo donde quieras.');
    else if (r === 'manual') modal('<h3>Tu resultado</h3><div class="cristal caja" style="white-space:pre-wrap;-webkit-user-select:text;user-select:text">' + esc(txt) + '</div><div class="peq mut">Mantén pulsado el texto para copiarlo.</div><button class="btn pri" data-act="cerrar">Cerrar</button>'); },
  ajuste: d => { P.ajustes[d.k] = !P.ajustes[d.k]; guardarPerfil(); pintar(); sonido('toque'); },
  borrar: () => modal('<h3>¿Borrar todo?</h3><div>Se eliminan tu nivel, logros, rachas y la campaña en curso. No se puede deshacer.</div><button class="btn" data-act="borrar-si">Sí, borrar todo</button><button class="btn pri" data-act="cerrar">Cancelar</button>'),
  'borrar-si': () => { Almacen.borrar('partida'); Almacen.borrar('perfil'); P = perfilNuevo(); G = null; comprobarDia(); cerrarModal(); ir('inicio'); aviso('Progreso borrado.'); }
};
document.addEventListener('click', ev => { const el = ev.target.closest('[data-act]'); if (!el) return; const f = ACT[el.dataset.act]; if (f) f(el.dataset); });
function atras() { // botón «atrás» de Android
  if (!$velo.hidden) { if ($velo.querySelector('[data-act="cerrar"]')) cerrarModal(); return; }
  const mapa = { modos: 'inicio', dificultad: 'modos', partido: 'inicio', perfil: 'inicio', ajustes: 'inicio', resultado: 'inicio' };
  if (U.pant === 'juego') ACT.menu(); else if (mapa[U.pant]) ir(mapa[U.pant]);
}
document.addEventListener('backbutton', ev => { ev.preventDefault(); atras(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') atras(); });

/* ── Arranque ── */
function arrancar() {
  const dia = comprobarDia(); ir('inicio');
  if (dia && P.stats.partidas > 0) modal('<div class="etq">Racha diaria</div><h3>🔥 ' + dia.racha + (dia.racha === 1 ? ' día' : ' días seguidos') + '</h3><div>Tu próxima campaña empieza con <b class="oro">+' + dia.bono + ' fondos</b>.' +
    (dia.racha < CONFIG.META.bonoDiarioTope ? ' Vuelve mañana y serán ' + CONFIG.META.bonoDiarioFondos * (dia.racha + 1) + '.' : '') + '</div><button class="btn pri" data-act="cerrar">Vamos</button>');
  try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
// Acceso para pruebas y ajuste de equilibrio desde la consola
window.MAYORIA = { CONFIG, REGIONES, get G() { return G; }, get P() { return P; }, nuevaPartida, ejecutar, puede, efecto, terminarSemana, resolverEvento, eventoActual, opcionPosible,
  opcionesPacto, cerrarCampana, proyeccion, nacional, comprarNodo, contratar, coste };
arrancar();
</script>
